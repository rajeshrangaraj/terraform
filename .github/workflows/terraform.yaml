name: Terraform EC2 Pipeline

on:
  push:
    branches: 
      - main
      - feat/my-ec2-change
  pull_request:
    branches: 
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15"
  AWS_REGION: "eu-west-2"
  TF_DIR: "ec2/infra"

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform version
        run: terraform --version

      - name: Terraform format check
        run: terraform fmt -check -recursive ec2/
      
      - name: Terrafom Init
        run: terraform init -backend=false
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TFDIR }}

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707421297413:role/github-actions-terraform-plan
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS Account ID Dynamic
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> ${GITHUB_OUTPUT}
          echo "Running in Account: ${ACCOUNT_ID}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -detailed-exitcode -out=tfplan -var-file="envs/prod/terraform.tfvars"
        working-directory: ${{ env.TF_DIR }}
        env: 
          TF_VAR_account_id: ${{ steps.get-account.outputs.account_id }}

  # approval:
  #   name: Await Approval
  #   runs-on: ubuntu-latest
  #   needs: plan
  #   if: |
  #     github.ref == 'refs/heads/main' &&
  #     needs.plan.output.exitcode == '2'
  #   environment: prod
  #   steps:
  #     - run: echo "Approved -proceeding to apply"

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    # needs: approval
    # if: github.ref == 'refs/heads/main'
    # environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Assume apply role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707421297413:role/github-actions-terraform-plan
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: hashicorp/setup-terraform@v3
        uses: actions/download-artifact@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id  }}
          path: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -auto-approve -input=false tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Output instance details
        run: terraform output -json
        working-directory: ${{ env.TF_DIR }}