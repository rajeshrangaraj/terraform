name: Terraform EC2 Pipeline

on:
  pull_request:
    branches: [main]
    paths: ["ec2/**"]
  push:
    branches: [main]
    paths: ["ec2/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.8.0"
  AWS_REGION: "eu-west-2"
  TF_DIR: "ec2/infra/env/prod"
  PLAN_ROLE:   "arn:aws:iam::707421297413:role/github-actions-terraform-plan"
  APPLY_ROLE:  "arn:aws:iam::707421297413:role/github-actions-terraform-apply"

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/ec2/

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TFDIR }}