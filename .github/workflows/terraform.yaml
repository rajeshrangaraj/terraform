name: Terraform EC2 Pipeline

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15"
  AWS_REGION: "eu-west-2"
  TF_DIR: "ec2/infra/envs/prod"
  PLAN_ROLE:   "arn:aws:iam::707421297413:role/github-actions-terraform-plan"
  APPLY_ROLE:  "arn:aws:iam::707421297413:role/github-actions-terraform-apply"

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform version
        run: terraform --version

      - name: Terraform format check
        run: terraform fmt -check -recursive ec2/
      
      - name: Terrafom Init
        run: terraform init -backend=false
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TFDIR }}

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam:${{ vars.AWS_ROLE_ARN }}
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS Dynamic Account ID
        id: account
        run: |
          ACCOINT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUT
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Plan
        env: 
          TF_VAR_account_id: ${{ steps.account.outputs.account_id }}